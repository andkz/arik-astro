<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Detector</title>
</head>
<body>
  <!-- This static file ensures Netlify form bot detects all form fields during deployment -->
  <form name="contact" netlify data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="service" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
